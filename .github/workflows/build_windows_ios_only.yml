name: Build Project
run-name: MajdataPlay build

on:
  push:
    branches: [ "dev", "main", "fastlane-ios", "test_workflow", "github-ci", "feature/multiplayer-sync" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_VERSION: 6000.3.17f1

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: ubuntu-latest
    env:
      CONFIGURATION: Release
      TARGET_PLATFORM: StandaloneWindows64

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version from unity project
        run: |
          VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          VERSION_WITH_HASH="${VERSION}-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "BUNDLE_VERSION_WITH_HASH=$VERSION_WITH_HASH" >> $GITHUB_ENV

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-

      - name: Build Release
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Custom
          version: ${{ env.BUNDLE_VERSION_WITH_HASH }}
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      - name: Package output as zip
        run: |
          set -euo pipefail
          mkdir -p out
          ZIP_NAME="MajdataPlay-Windows-${{ env.BUNDLE_VERSION_WITH_HASH }}.zip"
          cd "${{ env.CONFIGURATION }}"
          zip -qry "../out/${ZIP_NAME}" .
          cd -

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MajdataPlay-Windows
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------
  # 1. Export Xcode project using Unity on Linux (Docker)
  # -------------------------------------------------------------
  export-ios-xcode:
    name: Export iOS Xcode Project
    runs-on: ubuntu-latest
    env:
      CONFIGURATION: Release
      TARGET_PLATFORM: iOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version from unity project
        run: |
          VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          echo "BUNDLE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'ProjectSettings/**', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-

      - name: Export Unity to Xcode Project
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          versioning: Custom
          version: ${{ env.BUNDLE_VERSION }}
          buildName: MajdataPlay
          buildsPath: ${{ env.CONFIGURATION }}

      # Upload the exported Xcode project folder for the macOS runner
      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xcode-Project
          path: ${{ env.CONFIGURATION }}/iOS
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Build IPA on macOS using Xcode
  # -------------------------------------------------------------
  build-ios-ipa:
    name: Build (iOS Unsigned IPA)
    needs: export-ios-xcode
    runs-on: macos-latest
    env:
      CONFIGURATION: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version hash for artifact naming
        run: |
          VERSION=$(grep -m1 'bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')
          VERSION_WITH_HASH="${VERSION}-${GITHUB_SHA::7}"
          echo "BUNDLE_VERSION_WITH_HASH=$VERSION_WITH_HASH" >> $GITHUB_ENV

      # Download the exported Xcode project from the Linux step
      - name: Download Xcode Project
        uses: actions/download-artifact@v4
        with:
          name: Xcode-Project
          path: ${{ env.CONFIGURATION }}/iOS

      - name: Strip bitcode from static libraries
        run: |
          echo "Stripping bitcode from all .a files in exported project..."
          find "${{ env.CONFIGURATION }}/iOS" -name "*.a" -exec xcrun bitcode_strip -r {} -o {} \;
          echo "Bitcode strip complete."

      - name: Build Xcode Project (Unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${{ env.CONFIGURATION }}/iOS/MajdataPlay/Unity-iPhone.xcodeproj" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p out Payload
          
          APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          
          cp -R "$APP_PATH" Payload/
          zip -qry "out/MajdataPlay-iOS-${{ env.BUNDLE_VERSION_WITH_HASH }}-unsigned.ipa" Payload
          rm -rf Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MajdataPlay-iOS-Unsigned
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 7
